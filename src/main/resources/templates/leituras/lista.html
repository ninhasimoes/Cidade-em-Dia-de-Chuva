<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leituras · Cidade em Dia de Chuva</title>
    <style>
        :root {
            --fundo: #eef4f7;
            --cartao: #ffffff;
            --azul: #1d5c7a;
            --azul-claro: #d6e9f2;
            --texto: #1c2b33;
            --borda: #c9d9e2;
            --alerta: #b3261e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--fundo);
            color: var(--texto);
        }
        header {
            background: var(--azul);
            color: #fff;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .marca { display: flex; align-items: center; gap: 12px; }
        header h1 { margin: 0; font-size: 1.3rem; }
        nav a { color: #fff; margin-left: 20px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 900px; margin: 32px auto; padding: 0 16px; }
        .cartao {
            background: var(--cartao);
            border: 1px solid var(--borda);
            border-radius: 10px;
            padding: 24px;
        }
        .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .topo h2 { margin: 0; }
        .botao {
            display: inline-block;
            background: var(--azul);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
        }
        .botao:hover { opacity: 0.9; }
        .botao.perigo { background: var(--alerta); }
        .botao.claro { background: var(--azul-claro); color: var(--azul); }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--borda); }
        th { background: var(--azul-claro); color: var(--azul); }
        td.acoes form { display: inline; margin: 0; }
        td.acoes .botao { margin-right: 6px; }
        .erro {
            background: #fde7e5;
            color: var(--alerta);
            border: 1px solid var(--alerta);
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 16px;
        }
        .selo { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; }
        .selo.NORMAL  { background: #e3f2e4; color: #2e7d32; }
        .selo.ATENCAO { background: #fff1d6; color: #b26a00; }
        .selo.ALERTA  { background: #fbe3e1; color: #b3261e; }
        .vazio { color: #6b7c85; text-align: center; padding: 24px 0; }
    </style>
</head>
<body>
<header>
    <div class="marca">
        <!-- garça-branca (SVG próprio, sem arquivo de imagem) -->
        <svg class="garca" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="44" height="44"
             role="img" aria-label="Garça-branca">
            <circle cx="32" cy="32" r="31" fill="#2f7a9c"/>
            <path d="M30 47 L29 58 M35 47 L37 58" stroke="#f2b705" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            <path d="M13 41 L22 40 C25 33 36 31 42 36 C47 40 45 46 38 48 C31 50 24 48 21 45 Z" fill="#ffffff"/>
            <path d="M40 36 C47 28 34 26 37 18" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
            <circle cx="37" cy="15" r="4.2" fill="#ffffff"/>
            <path d="M40.5 13.5 L55 16 L40.5 17.5 Z" fill="#f2b705"/>
            <circle cx="38.2" cy="14" r="0.9" fill="#1c2b33"/>
        </svg>
        <h1>Cidade em Dia de Chuva</h1>
    </div>
    <nav>
        <a th:href="@{/bairros}">Bairros</a>
        <a th:href="@{/trechos}">Trechos</a>
        <a th:href="@{/leituras}">Leituras</a>
    </nav>
</header>

<main>
    <div class="cartao">
        <div class="topo">
            <h2>Leituras</h2>
            <a class="botao" th:href="@{/leituras/novo}">Nova leitura</a>
        </div>

        <!-- mensagem de erro, se o controller enviar o atributo "erro" -->
        <p class="erro" th:if="${erro != null}" th:text="${erro}"></p>

        <table th:if="${!leituras.isEmpty()}">
            <thead>
            <tr>
                <th>Data e hora</th>
                <th>Trecho</th>
                <th>Lâmina (cm)</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="leitura : ${leituras}">
                <td th:text="${#temporals.format(leitura.dataHora, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
                <td th:text="${leitura.trechoDescricao}">Rua Exemplo (Bairro)</td>
                <td th:text="${leitura.laminaCm}">8</td>
                <td><span class="selo" th:classappend="${leitura.status}" th:text="${leitura.status}">NORMAL</span></td>
                <td class="acoes">
                    <a class="botao claro" th:href="@{/leituras/{id}/editar(id=${leitura.id})}">Editar</a>
                    <form th:action="@{/leituras/{id}/excluir(id=${leitura.id})}" method="post"
                          onsubmit="return confirm('Excluir esta leitura?');">
                        <button type="submit" class="botao perigo">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <p class="vazio" th:if="${leituras.isEmpty()}">Nenhuma leitura cadastrada.</p>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel · Cidade em Dia de Chuva</title>
    <style>
        :root {
            --fundo: #eef4f7;
            --cartao: #ffffff;
            --azul: #1d5c7a;
            --azul-claro: #d6e9f2;
            --texto: #1c2b33;
            --borda: #c9d9e2;
            --normal: #2e7d32;
            --normal-fundo: #e3f2e4;
            --atencao: #b26a00;
            --atencao-fundo: #fff1d6;
            --alerta: #b3261e;
            --alerta-fundo: #fbe3e1;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--fundo);
            color: var(--texto);
        }
        header {
            background: var(--azul);
            color: #fff;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .marca { display: flex; align-items: center; gap: 12px; }
        header h1 { margin: 0; font-size: 1.3rem; }
        nav a { color: #fff; margin-left: 20px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 900px; margin: 32px auto; padding: 0 16px; }
        .topo { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .topo h2 { margin: 0; }
        .sub { color: #50646f; margin: 4px 0 20px; }
        .resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
        .contador {
            border-radius: 10px;
            padding: 16px 18px;
            border: 1px solid var(--borda);
            background: var(--cartao);
        }
        .contador .numero { font-size: 2rem; font-weight: 700; line-height: 1; }
        .contador .rotulo { margin-top: 6px; font-weight: 600; }
        .contador.normal  { background: var(--normal-fundo);  color: var(--normal); }
        .contador.atencao { background: var(--atencao-fundo); color: var(--atencao); }
        .contador.alerta  { background: var(--alerta-fundo);  color: var(--alerta); }
        .cartao {
            background: var(--cartao);
            border: 1px solid var(--borda);
            border-radius: 10px;
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--borda); }
        th { background: var(--azul-claro); color: var(--azul); font-size: 0.9rem; }
        tr:last-child td { border-bottom: none; }
        .selo {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .selo.NORMAL  { background: var(--normal-fundo);  color: var(--normal); }
        .selo.ATENCAO { background: var(--atencao-fundo); color: var(--atencao); }
        .selo.ALERTA  { background: var(--alerta-fundo);  color: var(--alerta); }
        .selo.SEM     { background: #e6ecef; color: #50646f; }
        .vazio { padding: 24px; text-align: center; color: #50646f; }
        .botao {
            display: inline-block;
            background: var(--azul);
            color: #fff;
            border-radius: 6px;
            padding: 9px 16px;
            font-size: 0.95rem;
            text-decoration: none;
        }
        .botao.claro { background: var(--azul-claro); color: var(--azul); }
        @media (max-width: 600px) { .resumo { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<header>
    <div class="marca">
        <svg class="garca" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="44" height="44"
             role="img" aria-label="Garça-branca">
            <circle cx="32" cy="32" r="31" fill="#2f7a9c"/>
            <path d="M30 47 L29 58 M35 47 L37 58" stroke="#f2b705" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            <path d="M13 41 L22 40 C25 33 36 31 42 36 C47 40 45 46 38 48 C31 50 24 48 21 45 Z" fill="#ffffff"/>
            <path d="M40 36 C47 28 34 26 37 18" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
            <circle cx="37" cy="15" r="4.2" fill="#ffffff"/>
            <path d="M40.5 13.5 L55 16 L40.5 17.5 Z" fill="#f2b705"/>
            <circle cx="38.2" cy="14" r="0.9" fill="#1c2b33"/>
        </svg>
        <h1>Cidade em Dia de Chuva</h1>
    </div>
    <nav>
        <a th:href="@{/bairros}">Bairros</a>
        <a th:href="@{/trechos}">Trechos</a>
        <a th:href="@{/leituras}">Leituras</a>
    </nav>
</header>

<main>
    <div class="topo">
        <h2>Painel · <span th:text="${bairro.nome}">Nome do bairro</span></h2>
        <a class="botao claro" th:href="@{/bairros}">Voltar</a>
    </div>
    <p class="sub">
        Zona <span th:text="${bairro.zona}">Zona</span> ·
        <span th:text="${bairro.possuiPiscinao} ? 'com piscinão' : 'sem piscinão'">piscinão</span>
    </p>

    <!-- contadores: o controller envia os 3 números prontos com os nomes normal, atencao e alerta -->
    <div class="resumo">
        <div class="contador normal">
            <div class="numero" th:text="${normal}">0</div>
            <div class="rotulo">Normal</div>
        </div>
        <div class="contador atencao">
            <div class="numero" th:text="${atencao}">0</div>
            <div class="rotulo">Atenção</div>
        </div>
        <div class="contador alerta">
            <div class="numero" th:text="${alerta}">0</div>
            <div class="rotulo">Alerta</div>
        </div>
    </div>

    <div class="cartao">
        <table th:if="${!itens.isEmpty()}">
            <thead>
            <tr>
                <th>Logradouro</th>
                <th>Calçada</th>
                <th>Altitude (m)</th>
                <th>Última lâmina (cm)</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${itens}">
                <td th:text="${item.logradouro}">Rua Exemplo</td>
                <td th:text="${item.tipoCalcada}">Calçada</td>
                <td th:text="${item.altitude}">10</td>
                <td>
                    <span th:if="${item.ultimaLamina != null}" th:text="${item.ultimaLamina}">8</span>
                    <span th:if="${item.ultimaLamina == null}">—</span>
                </td>
                <td>
                    <span th:if="${item.ultimoStatus != null}"
                          class="selo" th:classappend="${item.ultimoStatus}" th:text="${item.ultimoStatus}">NORMAL</span>
                    <span th:if="${item.ultimoStatus == null}" class="selo SEM">Sem leitura</span>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="vazio" th:if="${itens.isEmpty()}">Este bairro ainda não tem trechos cadastrados.</p>
    </div>
</main>
</body>
</html>
